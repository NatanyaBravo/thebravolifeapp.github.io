<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Bravo Life</title>
    <meta name="apple-itunes-app" content="app-argument=thebravolife://app">
    <meta name="google-play-app" content="app-id=com.thebravolifeapp">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #4B1D21;
            color: white;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .container {
            max-width: 400px;
            padding: 40px 20px;
        }
        .logo {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .message {
            font-size: 18px;
            margin-bottom: 30px;
        }
        .download-button {
            display: inline-block;
            background: #01875f;
            color: white;
            padding: 15px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin: 20px 0;
            transition: background 0.3s;
        }
        .download-button:hover {
            background: #016b4f;
        }
    </style>
    <script>
        // Detect if user is on mobile
        function isMobile() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        }
        
        // Detect if user is on iOS
        function isIOS() {
            return /iPad|iPhone|iPod/.test(navigator.userAgent);
        }
        
        // Detect if user is on Android
        function isAndroid() {
            return /Android/.test(navigator.userAgent);
        }
        
        // Try to open the app immediately
        function tryOpenApp() {
            // Try custom scheme first
            window.location.href = 'thebravolife://app';
            
            // Fallback after a short delay
            setTimeout(function() {
                // If we're still here, the app didn't open
                redirectToStore();
            }, 2000);
        }
        
        // Redirect to appropriate app store
        function redirectToStore() {
            if (isMobile()) {
                if (isIOS()) {
                    // Try multiple methods to open App Store app
                    openAppStore();
                } else if (isAndroid()) {
                    // Try multiple methods to open Play Store app
                    openPlayStore();
                } else {
                    // Fallback for other mobile browsers
                    showFallback();
                }
            } else {
                // Desktop - show fallback with both options
                showFallback();
            }
        }
        
        // Open App Store app with multiple fallbacks
        function openAppStore() {
            // Method 1: Try App Store app URL
            var appStoreUrl = 'itms-apps://itunes.apple.com/app/id6749274123';
            
            // Method 2: Try App Store app with action
            var appStoreActionUrl = 'itms-apps://apps.apple.com/app/the-bravo-life-delulu-sprint/id6749274123';
            
            // Method 3: Web App Store fallback
            var webUrl = 'https://apps.apple.com/app/the-bravo-life-delulu-sprint/id6749274123';
            
            // Try App Store app URL first
            var iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = appStoreUrl;
            document.body.appendChild(iframe);
            
            // If first method doesn't work, try alternative App Store URL
            setTimeout(function() {
                iframe.src = appStoreActionUrl;
            }, 1000);
            
            // Final fallback to web
            setTimeout(function() {
                window.location.href = webUrl;
            }, 3000);
        }
        
        // Open Play Store app with multiple fallbacks
        function openPlayStore() {
            // Method 1: Try Android intent URL
            var intentUrl = 'intent://details?id=com.thebravolifeapp#Intent;scheme=market;package=com.android.vending;end';
            
            // Method 2: Try market:// URL
            var marketUrl = 'market://details?id=com.thebravolifeapp';
            
            // Method 3: Web Play Store fallback
            var webUrl = 'https://play.google.com/store/apps/details?id=com.thebravolifeapp';
            
            // Try intent URL first
            var iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = intentUrl;
            document.body.appendChild(iframe);
            
            // If intent doesn't work, try market URL
            setTimeout(function() {
                iframe.src = marketUrl;
            }, 1000);
            
            // Final fallback to web
            setTimeout(function() {
                window.location.href = webUrl;
            }, 3000);
        }
        
        // Show fallback UI
        function showFallback() {
            document.getElementById('fallback').style.display = 'block';
        }
        
        // Try to open app when page loads
        window.onload = function() {
            tryOpenApp();
        };
    </script>
</head>
<body>
    <div class="container">
        <div class="logo">The Bravo Life</div>
        <div class="message">Opening the app...</div>
        <div id="fallback" style="display: none;">
            <div class="message">App not installed? Download it below:</div>
            <a href="https://play.google.com/store/apps/details?id=com.thebravolifeapp" class="download-button">
                Download for Android
            </a>
            <a href="https://apps.apple.com/app/the-bravo-life-delulu-sprint/id6749274123" class="download-button">
                Download for iOS
            </a>
            <div class="message" style="margin-top: 20px; font-size: 14px; opacity: 0.8;">
                Or scan QR code with your mobile device
            </div>
        </div>
    </div>
</body>
</html>
