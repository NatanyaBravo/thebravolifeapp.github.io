<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Bravo Life - Opening App</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #4B1D21;
            color: white;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .container {
            max-width: 400px;
            padding: 40px 20px;
        }
        .logo {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .loading {
            font-size: 18px;
            margin-bottom: 20px;
        }
        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">The Bravo Life</div>
        <div class="spinner"></div>
        <div class="loading">Opening app...</div>
    </div>
    
    <script>
        // App Store URLs (replace with your actual app store URLs)
        const IOS_APP_STORE_URL = 'https://apps.apple.com/app/the-bravo-life/id123456789'; // Replace with actual App Store URL
        const ANDROID_PLAY_STORE_URL = 'https://play.google.com/store/apps/details?id=com.thebravolifeapp'; // Replace with actual Play Store URL
        
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        const isAndroid = /Android/.test(navigator.userAgent);
        
        // Try to open the app using custom URL scheme
        function tryOpenApp() {
            const customScheme = 'thebravolife://app';
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = customScheme;
            document.body.appendChild(iframe);
            
            // Check if app opened after a delay
            setTimeout(() => {
                document.body.removeChild(iframe);
                redirectToStore();
            }, 2000);
        }
        
        function redirectToStore() {
            if (isIOS) {
                window.location.href = IOS_APP_STORE_URL;
            } else if (isAndroid) {
                window.location.href = ANDROID_PLAY_STORE_URL;
            } else {
                // Desktop - redirect to Play Store by default
                window.location.href = ANDROID_PLAY_STORE_URL;
            }
        }
        
        // Try to open app immediately
        tryOpenApp();
    </script>
</body>
</html>
