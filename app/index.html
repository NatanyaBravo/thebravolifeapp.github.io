<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Bravo Life</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #4B1D21;
            color: white;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .container {
            max-width: 400px;
            padding: 40px 20px;
        }
        .logo {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .message {
            font-size: 18px;
            margin-bottom: 30px;
        }
        .download-button {
            display: inline-block;
            background: #01875f;
            color: white;
            padding: 15px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin: 20px 0;
            transition: background 0.3s;
        }
        .download-button:hover {
            background: #016b4f;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">The Bravo Life</div>
        <div class="message">If you have the app installed, it should open automatically.</div>
        <div class="message">If not, download it below:</div>
        <a href="https://play.google.com/store/apps/details?id=com.thebravolifeapp" class="download-button">
            Download for Android
        </a>
    </div>
</body>
</html>
