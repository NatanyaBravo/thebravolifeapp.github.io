<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Bravo Life</title>
    <meta name="apple-itunes-app" content="app-argument=thebravolife://app">
    <meta name="google-play-app" content="app-id=com.thebravolifeapp">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #4B1D21;
            color: white;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .container {
            max-width: 400px;
            padding: 40px 20px;
        }
        .logo {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .message {
            font-size: 18px;
            margin-bottom: 30px;
        }
        .download-button {
            display: inline-block;
            background: #01875f;
            color: white;
            padding: 15px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin: 20px 0;
            transition: background 0.3s;
        }
        .download-button:hover {
            background: #016b4f;
        }
    </style>
    <script>
        // Try to open the app immediately
        function tryOpenApp() {
            // Try custom scheme first
            window.location.href = 'thebravolife://app';
            
            // Fallback after a short delay
            setTimeout(function() {
                // If we're still here, the app didn't open
                document.getElementById('fallback').style.display = 'block';
            }, 2000);
        }
        
        // Try to open app when page loads
        window.onload = function() {
            tryOpenApp();
        };
    </script>
</head>
<body>
    <div class="container">
        <div class="logo">The Bravo Life</div>
        <div class="message">Opening the app...</div>
        <div id="fallback" style="display: none;">
            <div class="message">App not installed? Download it below:</div>
            <a href="https://play.google.com/store/apps/details?id=com.thebravolifeapp" class="download-button">
                Download for Android
            </a>
            <a href="https://apps.apple.com/app/the-bravo-life/id123456789" class="download-button">
                Download for iOS
            </a>
        </div>
    </div>
</body>
</html>
